<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f3f1">
  <title>Create account | My Website</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css?v=custom-avatar-2">
</head>
<body data-page="signup">
  <header>
    <nav aria-label="Main navigation">
      <a class="logo" href="index.html">My Website</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="index.html#about">About</a>
        <label class="theme-toggle" title="Switch light / dark mode">
          <span class="theme-symbol" aria-hidden="true">☾</span>
          <input id="theme-toggle" type="checkbox" role="switch" aria-label="Dark mode">
          <span class="toggle-track" aria-hidden="true"></span>
        </label>
        <a class="nav-auth nav-login" id="nav-auth-link" href="login.html" aria-label="Log in">Log in</a>
      </div>
    </nav>
  </header>
  <main class="auth-area">
    <section class="auth-card" aria-labelledby="page-title">
      <h1 id="page-title">Create account</h1>
      <p class="auth-subtitle">Get started with your own account.</p>
      <form class="auth-form" id="auth-form">
        <div class="form-field"><label for="name">Your name</label><input id="name" name="name" type="text" placeholder="Enter your name" autocomplete="name" maxlength="60" required></div>
        <div class="form-field"><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required></div>
        <div class="form-field"><label for="password">Password</label><input id="password" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required></div>
        <div class="form-field"><label for="confirm-password">Confirm password</label><input id="confirm-password" name="confirm-password" type="password" placeholder="Repeat your password" autocomplete="new-password" minlength="8" required></div>
        <button class="button-primary full-width" id="auth-submit" data-requires-auth type="submit">Create account</button>
      </form>
      <div class="divider">or</div>
      <button class="button-google full-width" id="google-signin" data-requires-auth type="button"><svg width="19" height="19" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
  <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
  <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.27 5.48-4.78 7.18l7.73 6C44.51 37.94 46.98 31.73 46.98 24.55z"/>
  <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.47 0 20.12 0 24s.92 7.53 2.56 10.78l7.97-6.19z"/>
  <path fill="#34A853" d="M24 48c6.48 0 11.92-2.13 15.89-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
</svg><span>Continue with Google</span></button>
      <p class="switch-page">Already have an account? <a href="login.html">Log in</a></p>
      <p class="form-status" id="auth-status" role="status" aria-live="polite" hidden></p>
      <p class="setup-notice" id="setup-notice" role="status" hidden>
        Login isn't active yet. To enable accounts, connect a Firebase project in <code>firebase-config.js</code>.
      </p>
      <a class="button-secondary full-width back-link" href="index.html"><span aria-hidden="true">←</span> Back to home</a>
    </section>
  </main>
  <footer>© 2026 My Website</footer>
  <script type="module" src="auth.js?v=custom-avatar-2"></script>
  <script type="module" src="auth-nav.js?v=custom-avatar-2"></script>
</body>
</html>
