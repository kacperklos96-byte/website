<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f3f1">
  <title>My Website</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f3f1;
      --surface: #fafaf9;
      --text: #252525;
      --muted: #73736f;
      --line: #e1e1dd;
      --button: #cce6fa;
      --button-hover: #b6daf5;
      --button-text: #173e5d;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    header { border-bottom: 1px solid var(--line); }
    nav {
      max-width: 960px;
      margin: auto;
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .logo { font-size: 16px; font-weight: 650; color: var(--text); text-decoration: none; letter-spacing: -.3px; white-space: nowrap; }
    .nav-links { display: flex; align-items: center; gap: 25px; }
    .nav-links a { font-size: 14px; color: #555550; text-decoration: none; white-space: nowrap; }
    .nav-links a:hover { color: #111; }
    .nav-links .nav-login {
      padding: 8px 16px;
      color: var(--button-text);
      background: var(--button);
      border-radius: 8px;
      font-weight: 550;
      transition: background .15s ease;
    }
    .nav-links .nav-login:hover { color: var(--button-text); background: var(--button-hover); }
    main { flex: 1; }
    footer { border-top: 1px solid var(--line); padding: 22px 28px; text-align: center; font-size: 13px; color: var(--muted); }
    a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid #666; outline-offset: 3px; }
    @media (max-width: 480px) {
      nav { padding: 16px 20px; }
      .nav-links { gap: 14px; }
      .nav-links a { font-size: 13px; }
      .nav-links .nav-login { padding: 7px 11px; }
    }

    .content { max-width: 960px; padding: 0 28px; margin: 0 auto; }
    .hero { padding: 112px 0 125px; border-bottom: 1px solid var(--line); }
    h1 { font-size: clamp(35px, 6vw, 52px); line-height: 1.12; letter-spacing: -1.8px; margin: 0 0 20px; font-weight: 650; }
    .hero p { max-width: 480px; margin: 0; font-size: 16px; color: #686863; line-height: 1.75; }
    .button {
      display: inline-block;
      margin-top: 28px;
      padding: 11px 20px;
      background: var(--button);
      color: var(--button-text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 550;
      border-radius: 8px;
      transition: background .15s ease;
    }
    .button:hover { background: var(--button-hover); }
    .about { padding: 65px 0 100px; }
    h2 { font-size: 22px; line-height: 1.3; letter-spacing: -.6px; margin: 0 0 12px; }
    .about p { max-width: 550px; color: #686863; margin: 0; line-height: 1.75; }
    @media (max-width: 480px) {
      .content { padding: 0 20px; }
      .hero { padding: 76px 0 85px; }
      .about { padding: 48px 0 75px; }
    }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a class="logo" href="index.html">My Website</a>
      <div class="nav-links">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a class="nav-login" href="login.html">Log in</a>
      </div>
    </nav>
  </header>
  <main>
    <section id="home" class="hero">
      <div class="content">
        <h1>Welcome to my website.</h1>
        <p>A simple, clean website. No clutter, no unnecessary effects — just the basics.</p>
        <a href="#about" class="button">Learn more</a>
      </div>
    </section>
    <section id="about" class="about">
      <div class="content">
        <h2>About</h2>
        <p>This is a space where you can write a little about yourself, your project, or anything you like.</p>
      </div>
    </section>
  </main>
  <footer>© 2026 My Website</footer>
</body>
</html>
