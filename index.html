<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; color: #222; background: #fff; line-height: 1.6; }
    header { border-bottom: 1px solid #ddd; padding: 20px 24px; }
    nav { max-width: 900px; margin: auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: bold; font-size: 18px; }
    nav a { color: #333; text-decoration: none; margin-left: 20px; }
    nav a:hover { text-decoration: underline; }
    .nav-links { display: flex; align-items: center; gap: 20px; }
    .nav-links a { margin-left: 0; }
    .login-button { display: inline-block; text-decoration: none; border: 1px solid #222; background: #222; color: #fff; border-radius: 5px; padding: 8px 16px; cursor: pointer; font: inherit; }
    .login-button:hover { background: #444; }
    @media (max-width: 440px) { .nav-links { gap: 12px; } header { padding: 14px 16px; } .logo { font-size: 16px; } .login-button { padding: 7px 12px; } }
    main { max-width: 900px; margin: auto; padding: 90px 24px; }
    h1 { font-size: clamp(32px, 6vw, 48px); line-height: 1.2; margin: 0 0 16px; }
    p { max-width: 540px; color: #555; }
    .button { display: inline-block; margin-top: 16px; background: #222; color: white; padding: 11px 20px; text-decoration: none; border-radius: 5px; }
    .button:hover { background: #444; }
    section { margin-bottom: 100px; }
    h2 { font-size: 24px; }
    footer { border-top: 1px solid #ddd; text-align: center; padding: 20px; color: #777; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <nav>
      <div class="logo">My Website</div>
      <div class="nav-links"><a href="#home">Home</a><a href="#about">About</a><a class="login-button" href="login.html">Log in</a></div>
    </nav>
  </header>
  <main>
    <section id="home">
      <h1>Welcome to my website.</h1>
      <p>A simple, clean website. No clutter, no unnecessary effects — just the basics.</p>
      <a href="#about" class="button">Learn more</a>
    </section>
    <section id="about">
      <h2>About</h2>
      <p>This is a space where you can write a little about yourself, your project, or anything you like.</p>
    </section>
  </main>
  <footer>© 2026 My Website</footer>

</body>
</html>
