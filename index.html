<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f3f1">
  <title>Home | My Website</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css?v=platform-2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body data-page="home">
  <header>
    <nav aria-label="Main navigation">
      <a class="logo" href="index.html">My Website</a>
      <div class="nav-links">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        
        
        <a class="nav-auth nav-login" id="nav-auth-link" href="login.html" aria-label="Log in">Log in</a>
      </div>
    </nav>
  </header>
  <main>
    <section class="hero" id="home">
      <div class="content">
        <h1>Welcome to my website.</h1>
        <p>A simple, clean website. No clutter, no unnecessary effects — just the basics.</p>
        <a class="button-primary" href="#about">Learn more</a>
      </div>
    </section>
    <section class="about" id="about">
      <div class="content">
        <h2>About</h2>
        <p>This is a space where you can write a little about yourself, your project, or anything you like.</p>
      </div>
    </section>
  </main>
  <footer class="site-footer"><span>© 2026 My Website</span>
  <label class="theme-toggle theme-toggle-footer" title="Switch light / dark mode">
    <span class="theme-symbol" aria-hidden="true"><i class="fas fa-moon"></i></span>
    <span class="theme-label">Theme</span>
    <input id="theme-toggle" type="checkbox" role="switch" aria-label="Dark mode">
    <span class="toggle-track" aria-hidden="true"></span>
  </label></footer>
  
  <script type="module" src="auth-nav.js?v=platform-2"></script>
</body>
</html>
