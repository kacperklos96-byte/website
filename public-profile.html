<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f3f1">
  <title>Member profile | My Website</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css?v=nav-refresh-2">
  <link rel="stylesheet" href="profile.css?v=nav-refresh-2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body data-page="public-profile">
  <header>
    <nav aria-label="Main navigation">
      <a class="logo" href="index.html">My Website</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        
        
        <a class="nav-auth nav-login" id="nav-auth-link" href="login.html">Log in</a>
      </div>
    </nav>
  </header>
  <main class="public-profile-shell">
    <div class="profile-breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><span>Member profile</span></div>
    <div class="public-profile-card">
      <div class="preview-banner public-banner"><span class="preview-small-star"><i class="fas fa-star" aria-hidden="true"></i></span></div>
      <div id="public-profile-avatar" class="preview-avatar public-avatar" aria-hidden="true"></div>
      <div id="public-loading" class="public-loading" role="status">Loading profile…</div>
      <div id="public-profile-content" hidden>
        <div class="public-profile-heading"><div><h1 id="public-name"></h1><p class="preview-handle" id="public-handle"></p></div><span class="profile-public-tag">Public profile</span></div>
        <p id="public-bio" class="public-bio"></p>
        <div class="public-profile-foot"><span>Member since</span><strong id="public-joined"></strong></div>
        <p class="public-profile-note">This member chose to share this profile. Email and private account information are never displayed.</p>
      </div>
    </div>
    <div class="public-profile-actions">
      <a id="public-message-link" class="button-primary" href="messages.html" hidden>Send a message <i class="fas fa-envelope" aria-hidden="true"></i></a>
      <a href="index.html" class="button-secondary"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back to home</a>
    </div>
  </main>
  <footer class="site-footer"><span>© 2026 My Website</span>
  <label class="theme-toggle theme-toggle-footer" title="Switch light / dark mode">
    <span class="theme-symbol" aria-hidden="true"><i class="fas fa-moon"></i></span>
    <span class="theme-label">Theme</span>
    <input id="theme-toggle" type="checkbox" role="switch" aria-label="Dark mode">
    <span class="toggle-track" aria-hidden="true"></span>
  </label></footer>
  <script type="module" src="auth-nav.js?v=nav-refresh-2"></script>
  <script type="module" src="public-profile.js?v=nav-refresh-2"></script>
</body>
</html>
