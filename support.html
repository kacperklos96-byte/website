<link rel="stylesheet" href="styles.css?v=platform-1"><link rel="stylesheet" href="community.css?v=platform-1"><link rel="stylesheet" href="platform.css?v=platform-1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head>
<body data-page="support"><header><nav><a class="logo" href="index.html">My Website</a><div class="nav-links"><a href="dashboard.html">Dashboard</a><a class="nav-auth nav-login" id="nav-auth-link" href="login.html">Log in</a></div></nav></header>
<main class="community-shell"><div class="community-head"><div><p class="community-eyebrow">HELP · SUPPORT</p><h1>Support Center<span>.</span></h1><p>Open a private support ticket and read staff responses.</p></div><a href="messages.html" class="button-secondary">Community</a></div>
<div class="community-two-col">
<section class="community-panel"><h2>Create a ticket</h2><form id="ticket-form">
<div class="community-field"><label for="ticket-subject">Subject</label><input class="community-input" id="ticket-subject" required minlength="3" maxlength="100" placeholder="How can we help?"></div>
<div class="community-field"><label for="ticket-body">Details</label><textarea class="community-textarea" id="ticket-body" required minlength="10" maxlength="2000" rows="7" placeholder="Describe your question or issue…"></textarea></div>
<button class="community-button primary" id="ticket-send" type="submit">Create ticket</button></form>
<p id="ticket-status" class="community-state" role="status">Checking your account…</p></section>
<section class="community-panel"><h2>Your tickets</h2><p class="community-muted">Tickets are private to you and authorized staff.</p><div id="my-tickets" class="community-list"></div></section>
</div></main><footer class="site-footer"><span>© 2026 My Website</span><label class="theme-toggle theme-toggle-footer"><span class="theme-symbol"><i class="fas fa-moon"></i></span><span class="theme-label">Theme</span><input id="theme-toggle" type="checkbox" role="switch" aria-label="Dark mode"><span class="toggle-track"></span></label></footer>
